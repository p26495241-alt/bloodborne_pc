name: Execute Shell Script

# Controls when the workflow will run
on:
  push:
    branches: [ "windows" ] # Triggers the workflow on push events to the main branch
  pull_request:
    branches: [ "windows" ] # Triggers the workflow for pull requests targeting main
  workflow_dispatch:      # Allows you to manually trigger this workflow from the Actions tab

jobs:
  execute-script:
    # The type of runner the job will run on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch the repository code so the runner can access your script
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Ensure the runner has permission to execute the script
      - name: Grant execute permission to script
        run: chmod +x ./script.sh

      # Step 3: Run the shell script
      - name: Run the shell script
        run: ./tools/build_assets.sh
